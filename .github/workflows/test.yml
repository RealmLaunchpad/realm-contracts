name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:


env:
  FOUNDRY_PROFILE: ci
  MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
  # Archive endpoint: the Robinhood fork suites pin a block.
  ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    environment: tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Show Forge version
        run: |
          forge --version

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Forge fmt
        run: |
          forge fmt --check
        id: fmt

      # The token impls bake one chain's addresses; the committed tree may be left retargeted at a
      # deploy chain, so pin the build (and the mainnet-forked tests below) to the test default.
      - name: Forge build
        run: |
          just chain-mainnet
          forge build --sizes
        id: build

      - name: Deployment manifest drift check
        run: |
          forge script ExportDeployments
          if ! git diff --exit-code deployments.ethereum.sepolia.md deployments.robinhood.mainnet.md deployments.robinhood.testnet.md; then
            echo "::error::deployments.{ethereum,robinhood,arc}.*.md is out of sync with the .sol manifest. Run 'just export-deployments' and commit the result."
            exit 1
          fi
        id: deployments_drift

      - name: Forge tests (no invariants, no integration)
        run: |
          forge test --no-match-contract Invariants --no-match-path "test/integration/**" -vvv
        id: unit_tests

      - name: Lean Invariant tests
        run: |
          sed -i 's/runs = [0-9]*/runs = 1/' foundry.toml
          sed -i 's/depth = [0-9]*/depth = 5/' foundry.toml
          forge test --match-contract Invariants
        id: invariants

      # Retargets the impls to Robinhood and runs the suites that fork it (real xStock dividends).
      - name: Robinhood mainnet fork tests
        run: |
          just test-robinhood-fork
        id: robinhood_fork_tests
