[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# via_ir = true
optimizer = true
optimizer_runs = 200
threads = 4
evm_version = "cancun"
# Robinhood Chain (Arbitrum Orbit) caps deployed code at 98,304 bytes (96 KB), not EIP-170's 24,576
# (verified against both RPCs: 98,305 reverts "max code size exceeded"). The taxable tokens rely on it:
# they exceed 24 KB, so they would NOT deploy on Ethereum mainnet. Foundry's local EVM defaults to the
# Ethereum limit even on a Robinhood fork, so this is what lets tests and script simulations deploy them.
code_size_limit = 98304

verbosity = 3

# Allow ExportDeployments script to (re)write the generated deployment manifests.
fs_permissions = [
    { access = "read-write", path = "./deployments.robinhood.mainnet.md" },
    { access = "read-write", path = "./deployments.robinhood.testnet.md" },
    # V4 dividend route candidates, read by `PickDividendRoutes`. Generated by
    # `script/operations/dividend-routes/discover_xstock_routes.py`.
    { access = "read", path = "./script/operations/dividend-routes" },
    # Quote-asset listings, read by `WhitelistRobinhoodAssets`. Generated by
    # `script/operations/assets-whitelist/discover_whitelist_assets.py`.
    { access = "read", path = "./script/operations/assets-whitelist" },
]

# extra_output = ["storageLayout"]

# Build target for `just fast-test` and `just test-rh-fork`: every suite forks Robinhood mainnet and
# needs the token impls retargeted (`just chain-rh`); a separate out/cache keeps the default build warm.
[profile.robinhood]
out = "out-robinhood"
cache_path = "cache-robinhood"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[invariant]
runs = 50 #256
depth = 250 #500
fail_on_revert = false
# call_override = false
# dictionary_weight = 80
# include_storage = true
# include_push_bytes = true
# shrink_run_limit = 5000

# RPC endpoints (uses env vars)
# Robinhood Chain is an Arbitrum L2 with native ETH. Public RPCs:
#   mainnet  https://rpc.mainnet.chain.robinhood.com
#   testnet  https://rpc.testnet.chain.robinhood.com
[rpc_endpoints]
rh-mainnet = "${ROBINHOOD_RPC_URL}"
rh-testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

# No `[etherscan]` table on purpose. Robinhood is NOT in Foundry's chain registry (v1.5.1); adding it
# there with `chain = 4663/46630` makes EVERY `forge script` run abort with "Chain <id> not supported".
# Robinhood uses Blockscout, so the verifier is passed on the CLI instead: the `*-rh*` recipes append
# `{{robinhood_verify}}` / `{{robinhood_testnet_verify}}` (justfile).
