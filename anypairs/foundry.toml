[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# No metadata hash in the bytecode: a comment-only or formatting-only change must leave every contract's bytecode
# byte-identical, which is how such changes are verified.
cbor_metadata = false
bytecode_hash = "none"
# Tests deploy the V4 PoolManager (solc 0.8.26) from a prebuilt artifact.
fs_permissions = [{ access = "read", path = "./artifacts" }]
# No `libraries = [...]` pin is committed: tests link the libraries from src/. Pin deployed addresses only on the
# command line of a deploy build (docs/DEPLOY_UNIFIED.md).
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[rpc_endpoints]
rh-mainnet = "${ROBINHOOD_RPC_URL}"
